name: Connectome checked-out source and learning
on:
  push:
    branches: [main]
    paths: ['Sources/**', 'Tests/**', 'Package.swift', 'tools/*connectome*', 'tools/*numilab*', '.github/workflows/connectome-decoder-check.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: connectome-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apple-source-and-learning:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record exact checkout
        run: |
          mkdir -p diagnostics
          git rev-parse HEAD > diagnostics/revision.txt
          sw_vers > diagnostics/host.txt
          xcodebuild -version >> diagnostics/host.txt
          swift --version >> diagnostics/host.txt
          test ! -e .numi/connectome-decoder
          test ! -e tools/materialize_connectome_source.py
      - name: Acquire checksum-pinned public data release
        run: |
          set -euo pipefail
          python3 tools/fetch_connectome_release.py --output-dir downloaded/packs | tee diagnostics/data.json
      - name: Verify import and native contracts
        run: |
          set -euo pipefail
          python3 -m venv /tmp/numi-connectome-check
          /tmp/numi-connectome-check/bin/python -m pip install numpy pyarrow
          /tmp/numi-connectome-check/bin/python tools/test_connectome_native.py 2>&1 | tee diagnostics/native-tests.txt
          /tmp/numi-connectome-check/bin/python tools/test_connectome_audit.py 2>&1 | tee diagnostics/connectivity-tests.txt
          /tmp/numi-connectome-check/bin/python tools/test_connectome_import.py 2>&1 | tee diagnostics/import-tests.txt
          /tmp/numi-connectome-check/bin/python tools/test_connectome_release.py 2>&1 | tee diagnostics/data-tests.txt
      - uses: actions/checkout@v4
        with:
          repository: Numi2/numi-lab
          ref: 4a369ca846fde93016f3708f3fd9386c992b52a4
          path: .build/numilab-source
          persist-credentials: false
          sparse-checkout: |
            include
            src/core
      - name: Export actual native robot frames and actuator interfaces
        run: |
          set -euo pipefail
          python3 tools/export_numilab_robot.py --numilab .build/numilab-source --output-dir .build/numilab-interfaces | tee diagnostics/robot-import.json
          cp .build/numilab-interfaces/*.json diagnostics/
      - name: Build every package target and test target without source reconstruction
        run: |
          set -euo pipefail
          swift build -c release -Xswiftc -enable-testing --build-tests 2>&1 | tee diagnostics/package-build.txt
          sh tools/build_swiftpm_mlx_metallib.sh release 2>&1 | tee diagnostics/mlx-library.txt
      - name: Exercise graph, body, decoder and full-data shader tests
        env:
          NUMIBRAIN_NUMILAB_INTERFACES: ${{ github.workspace }}/.build/numilab-interfaces
          NUMIBRAIN_CONNECTOME_GRAPH: ${{ github.workspace }}/downloaded/packs/male-cns-v1.0-neuron-unsigned.numicns
        run: |
          set -euo pipefail
          swift test -c release --skip-build --filter 'NumiLabReplayCheckpointTests|NumiLabPositionHostActionAdapterTests|NumiLabTaskActionContractTests|NumiLabRobotInterfaceTests|ConnectomeControllerTests|ConnectomeDecoderForkTests|ConnectomeBodyContractTests|ConnectomeGraphTests|ConnectomeConnectivityAuditTests|ConnectomeDecoderStudyTests|MetalConnectomeKernelTests|MLXConnectomeDecoderCalibrationTests' 2>&1 | tee diagnostics/tests.txt
          grep 'NUMIBRAIN_FULL_CONNECTOME_KERNEL ' diagnostics/tests.txt > diagnostics/full-graph-kernel.txt
          git diff --exit-code
          printf '%s\n' 'Full package build plus selected source/shader/learner/action-contract, replay-checkpoint and authenticated NumiLab host-transport checks against the exact hardened owner revision. The owner ABI supplies live compiled action bindings and a logical-byte resident-state digest. Production Metal 4 joint-root campaigns, learned robot-task performance and hardware safety are not qualified by this job.' > diagnostics/scope.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connectome-package-${{ github.sha }}
          path: diagnostics/
          retention-days: 90
          if-no-files-found: error
