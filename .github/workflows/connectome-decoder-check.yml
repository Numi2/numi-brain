name: Check recovered connectome decoder sources
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/connectome-decoder-check.yml'
      - 'tools/materialize_connectome_source.py'
      - 'tools/run_connectome_apple_tests.py'
      - '.numi/connectome-decoder/materialized-source.json'
      - '.numi/connectome-decoder/numerical-publication.patch'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  apple-source-and-learning:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Reconstruct reviewed source in this temporary checkout only
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          git rev-parse HEAD > diagnostics/base-revision.txt
          python3 tools/materialize_connectome_source.py --apply --expected-head "$GITHUB_SHA" --output-patch diagnostics/full-source.patch | tee diagnostics/materialization.json
          git diff --check
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Numi2/numi-brain
          run-id: 34173965507
          name: male-cns-v1.0-classified-neuron-pack
          path: downloaded/
      - name: Verify data and portable contracts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('downloaded/packs/male-cns-v1.0-neuron-unsigned.numicns')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='58314f44a02afe0726e5ba699a533d203b85b2fd6125bc0542b5db72cf993a1c'
          PY
          cp downloaded/packs/inspection.json diagnostics/full-graph-inspection.json
          python3 -m venv /tmp/numi-decoder-check
          /tmp/numi-decoder-check/bin/python -m pip install numpy pyarrow
          /tmp/numi-decoder-check/bin/python tools/test_connectome_native.py 2>&1 | tee diagnostics/native-tests.txt
          /tmp/numi-decoder-check/bin/python tools/test_connectome_import.py 2>&1 | tee diagnostics/import-tests.txt
      - name: Compile real Apple sources and execute shader and learner tests
        run: |
          set -euo pipefail
          sw_vers | tee diagnostics/apple-host.txt
          xcodebuild -version | tee -a diagnostics/apple-host.txt
          swift --version | tee -a diagnostics/apple-host.txt
          export NUMIBRAIN_CONNECTOME_GRAPH="$PWD/downloaded/packs/male-cns-v1.0-neuron-unsigned.numicns"
          python3 tools/run_connectome_apple_tests.py --with-learning 2>&1 | tee diagnostics/apple-tests.txt
          grep 'NUMIBRAIN_FULL_CONNECTOME_KERNEL ' diagnostics/apple-tests.txt > diagnostics/full-graph-kernel.txt
          printf '%s\n' 'Source/kernel/learner checks only. Production Metal 4 roots and physical robot tasks are not qualified.' > diagnostics/scope.txt
      - name: Retain reviewed source and diagnostics without publishing code
        if: always()
        run: |
          mkdir -p diagnostics
          git diff > diagnostics/remaining-diff.patch
          tar --exclude=.git --exclude=.build --exclude=diagnostics --exclude=downloaded --exclude=.numi/connectome-finalize --exclude=.numi/connectome-decoder -czf /tmp/connectome-checked-source.tar.gz .
          mv /tmp/connectome-checked-source.tar.gz diagnostics/source.tar.gz
          shasum -a 256 diagnostics/source.tar.gz > diagnostics/source.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connectome-decoder-check-${{ github.sha }}
          path: diagnostics/
          retention-days: 90
          if-no-files-found: error
