name: Connectome checked-out source and learning
on:
  push:
    branches: [main]
    paths: ['Sources/**', 'Tests/**', 'Package.swift', 'tools/*connectome*', '.github/workflows/connectome-decoder-check.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: connectome-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apple-source-and-learning:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record exact checkout
        run: |
          mkdir -p diagnostics
          git rev-parse HEAD > diagnostics/revision.txt
          sw_vers > diagnostics/host.txt
          xcodebuild -version >> diagnostics/host.txt
          swift --version >> diagnostics/host.txt
          test ! -e .numi/connectome-decoder
          test ! -e tools/materialize_connectome_source.py
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: Numi2/numi-brain
          run-id: 34173965507
          name: male-cns-v1.0-classified-neuron-pack
          path: downloaded/
      - name: Verify graph and import contracts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('downloaded/packs/male-cns-v1.0-neuron-unsigned.numicns')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='58314f44a02afe0726e5ba699a533d203b85b2fd6125bc0542b5db72cf993a1c'
          PY
          python3 -m venv /tmp/numi-connectome-check
          /tmp/numi-connectome-check/bin/python -m pip install numpy pyarrow
          /tmp/numi-connectome-check/bin/python tools/test_connectome_native.py 2>&1 | tee diagnostics/native-tests.txt
          /tmp/numi-connectome-check/bin/python tools/test_connectome_audit.py 2>&1 | tee diagnostics/connectivity-tests.txt
          /tmp/numi-connectome-check/bin/python tools/test_connectome_import.py 2>&1 | tee diagnostics/import-tests.txt
      - name: Build every package target and test target without source reconstruction
        run: |
          set -euo pipefail
          swift build -c release -Xswiftc -enable-testing --build-tests 2>&1 | tee diagnostics/package-build.txt
          sh tools/build_swiftpm_mlx_metallib.sh release 2>&1 | tee diagnostics/mlx-library.txt
      - name: Exercise graph, decoder and full-data shader tests
        env:
          NUMIBRAIN_CONNECTOME_GRAPH: ${{ github.workspace }}/downloaded/packs/male-cns-v1.0-neuron-unsigned.numicns
        run: |
          set -euo pipefail
          swift test -c release --skip-build --filter 'ConnectomeControllerTests|ConnectomeGraphTests|ConnectomeConnectivityAuditTests|ConnectomeDecoderStudyTests|MetalConnectomeKernelTests|MLXConnectomeDecoderCalibrationTests' 2>&1 | tee diagnostics/tests.txt
          grep 'NUMIBRAIN_FULL_CONNECTOME_KERNEL ' diagnostics/tests.txt > diagnostics/full-graph-kernel.txt
          git diff --exit-code
          printf '%s\n' 'Full package build and selected source/shader/learner checks. Production Metal 4 roots and physical tasks are not qualified.' > diagnostics/scope.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connectome-package-${{ github.sha }}
          path: diagnostics/
          retention-days: 90
          if-no-files-found: error
