name: Prepare reviewed connectome source objects
on:
  push:
    branches: [main]
    paths: ['.github/workflows/connectome-source-objects.yml']
permissions:
  contents: read
jobs:
  source-objects:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Expand the existing reviewed source without executing it
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          python3 tools/materialize_connectome_source.py --apply --expected-head "$GITHUB_SHA" > diagnostics/materialization.json
          git diff --check
      - name: Store immutable source blobs only; do not create commits or update branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path.cwd()
          manifest=json.loads((root/'.numi/connectome-decoder/materialized-source.json').read_text())
          assert manifest['version']==1 and manifest['promotable'] is False
          assert len(manifest['files'])==22
          result=[]
          for name,sha256 in sorted(manifest['files'].items()):
              p=pathlib.PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts
              assert name=='README.md' or name.startswith(('Sources/','Tests/','tools/','docs/','evidence/'))
              path=root/name
              assert not path.is_symlink()
              data=path.read_bytes()
              assert len(data)<=524288 and hashlib.sha256(data).hexdigest()==sha256
              expected=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              body=json.dumps({'content':data.decode('utf-8'),'encoding':'utf-8'}).encode()
              response=subprocess.run(['gh','api','--method','POST','repos/Numi2/numi-brain/git/blobs','--input','-'],input=body,capture_output=True,check=True)
              observed=json.loads(response.stdout)['sha']
              assert observed==expected
              result.append({'path':name,'mode':'100644','type':'blob','sha':observed,'sha256':sha256})
          (root/'diagnostics/objects.json').write_text(json.dumps({'baseCommit':os.environ['GITHUB_SHA'],'files':result,'branchesModified':False},indent=2)+'\n')
          print((root/'diagnostics/objects.json').read_text())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: connectome-reviewed-source-objects
          path: diagnostics/
          retention-days: 30
          if-no-files-found: error
