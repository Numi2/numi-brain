name: Verify native connectome integration candidate
on:
  push:
    branches: [integration/connectome-native-20260907]
    paths:
      - '.numi/connectome.delta.*'
      - '.github/workflows/connectome-candidate.yml'
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.publish.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct exact reviewed source tree
        shell: bash
        run: |
          set -euo pipefail
          cat .numi/connectome.delta.{0,1,2,3} > "$RUNNER_TEMP/connectome.delta.xz"
          git checkout --detach 68c2af0d3856f0cb101490137caebee1f994121e
          python3 - <<'PY'
          import hashlib,json,lzma,os,subprocess
          from pathlib import Path,PurePosixPath
          payload=lzma.decompress((Path(os.environ['RUNNER_TEMP'])/'connectome.delta.xz').read_bytes())
          assert hashlib.sha256(payload).hexdigest()=='f1a1d0b345fa2b3fc12c777344b1567a77c8fd3347a3fa650d66b551d18564ef'
          entries=json.loads(payload); paths=[]
          for entry in entries:
              path=PurePosixPath(entry['path'])
              assert not path.is_absolute() and '..' not in path.parts and path.parts[0] in ('Sources','Tests','docs','tools')
              target=Path(path)
              assert not target.is_symlink()
              old=target.read_bytes() if target.exists() else b''
              assert hashlib.sha256(old).hexdigest()==entry['old'],str(path)
              lines=old.decode().splitlines(keepends=True)
              previous=0
              for start,end,text in entry['edits']:
                  assert previous<=start<=end<=len(lines)
                  previous=end
              for start,end,text in reversed(entry['edits']): lines[start:end]=text.splitlines(keepends=True)
              new=''.join(lines).encode()
              assert hashlib.sha256(new).hexdigest()==entry['new'],str(path)
              target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(new); paths.append(str(path))
          subprocess.run(['git','add','--',*paths],check=True)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree=='f79f566f0e2ba09a088c19c65fc17a1b9f75be28',tree
          print('Verified source tree:',tree)
          PY
          git diff --cached --check
      - name: Native contract regressions
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/diagnostics"
          python3 tools/test_connectome_native.py 2>&1 | tee "$RUNNER_TEMP/diagnostics/native-tests.txt"
          python3 scripts/check-executable-model-contract.py
      - name: Publish candidate branch without modifying main
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NumiBrain integration'
          git config user.email '33553832+Numi2@users.noreply.github.com'
          git commit -m 'feat: integrate connectome execution with native control and complete state recovery' -m 'Move neural activity into the authoritative transactional arena, invoke it through the normal factory and decision paths, decode through existing motor inhibition, and bind checkpoint identity to graph/body/decoder. Add native decoder validation and Apple transaction/replay regressions; fix cross-module Core helper visibility.'
          revision=$(git rev-parse HEAD)
          git push origin HEAD:refs/heads/integration/connectome-applied-${GITHUB_RUN_ID}
          echo "commit=$revision" >> "$GITHUB_OUTPUT"
          echo "$revision" > "$RUNNER_TEMP/diagnostics/revision.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/diagnostics/source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connectome-candidate-native-${{ github.run_id }}
          path: ${{ runner.temp }}/diagnostics/
          retention-days: 7
  apple:
    needs: native
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.native.outputs.commit }}
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: .build
          key: connectome-apple-${{ runner.arch }}-${{ hashFiles('Package.resolved') }}-${{ needs.native.outputs.commit }}
          restore-keys: connectome-apple-${{ runner.arch }}-${{ hashFiles('Package.resolved') }}-
      - name: Toolchain identity
        run: |
          mkdir -p diagnostics
          { git rev-parse HEAD; sw_vers; xcodebuild -version; swift --version; system_profiler SPDisplaysDataType; } | tee diagnostics/toolchain.txt
      - name: Compile source and shaders
        shell: bash
        run: |
          set -o pipefail
          swift build -c release --product numi-brain-experiment 2>&1 | tee diagnostics/build.txt
          xcrun -sdk macosx metal -c Sources/NumiBrainMetal/Shaders/ConnectomeRate.metal -o "$RUNNER_TEMP/connectome.air" 2>&1 | tee diagnostics/shaders.txt
          xcrun -sdk macosx metal -I Sources/NumiBrainMetal/Shaders -c Sources/NumiBrainMetal/Shaders/DecisionState.metal -o "$RUNNER_TEMP/decision.air" 2>&1 | tee -a diagnostics/shaders.txt
      - name: Execute focused graph, neural, checkpoint and replay tests
        shell: bash
        run: |
          set -o pipefail
          swift test -c release --filter 'ConnectomeGraphTests|MetalConnectomeKernelTests|MetalConnectomeIntegrationTests' 2>&1 | tee diagnostics/tests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connectome-candidate-apple-${{ github.run_id }}
          path: diagnostics/
          retention-days: 7
