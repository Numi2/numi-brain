name: NumiLab reference Apple hardware qualification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: numilab-owner-replay-reference
  cancel-in-progress: false
jobs:
  native-physics:
    runs-on: [self-hosted, macOS, ARM64, numilab-metal4]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: brain
      - uses: actions/checkout@v4
        with:
          repository: Numi2/numi-lab
          ref: 973676ebee749a77b950d72e30d7bcde9873e06c
          path: native-owner
          persist-credentials: false
      - name: Qualify the exact native owner on physical Metal 4
        run: |
          python3 brain/tools/qualify_numilab_reference.py \
            --native-owner "$PWD/native-owner" \
            --numilab-sha 973676ebee749a77b950d72e30d7bcde9873e06c \
            --output "${RUNNER_TEMP}/numilab-reference-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numilab-reference-${{ github.sha }}
          path: |
            ${{ runner.temp }}/numilab-reference-${{ github.run_id }}-${{ github.run_attempt }}/*.json
            ${{ runner.temp }}/numilab-reference-${{ github.run_id }}-${{ github.run_attempt }}/*.txt
          retention-days: 30
          if-no-files-found: error
